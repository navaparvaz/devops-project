events {}



http {

  server {

    listen 80;



    location /realms/master/protocol/openid-connect/auth {

      proxy_pass http://keycloak:8080;

      proxy_set_header Host $host;

      proxy_set_header X-Real-IP $remote_addr;

    }



    location / {

      deny all;

      return 403;

    }

  }

}
