version: "3.8"



networks:

  elk-internal:

    driver: overlay

    internal: true

  proxy-net:

    driver: overlay



services:

  es-hot:

    image: nginx:alpine

    networks:

      - elk-internal

    deploy:

      replicas: 1



  es-warm:

    image: nginx:alpine

    networks:

      - elk-internal

    deploy:

      replicas: 1



  es-cold:

    image: nginx:alpine

    networks:

      - elk-internal

    deploy:

      replicas: 1



  kibana:

    image: nginx:alpine

    networks:

      - elk-internal

      - proxy-net

    deploy:

      replicas: 1



  haproxy:

    image: haproxy:2.9-alpine

    ports:

      - "443:443"

    volumes:

      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

      - ./certs:/usr/local/etc/haproxy/certs:ro

    networks:

      - proxy-net

    deploy:

      replicas: 1
